<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Brand Name</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header>
      <h1>Halie Grace Creates</h1>
      <nav class="theme-buttons">
        <button onclick="setTheme('theme-one')">Theme 1</button>
        <button onclick="setTheme('theme-two')">Theme 2</button>
        <button onclick="setTheme('theme-three')">Theme 3</button>
      </nav>
    </header>
    <section class="hero">
      <h2>Check this out</h2>
      <p>This is my awesome brand that I love so dearly.</p>
    </section>
    <section class="cards">
      <div class="card">
        <img src="images/couple.jpg" alt="Card Image 1" />
        <h3>Couple Photos</h3>
        <p>
          Here is where I have awesome couple photos.
        </p>
      </div>
      <div class="card">
        <img src="images/family.jpg" alt="Card Image 2" />
        <h3>Family Photos</h3>
        <p>
          Love taking family photos.
        </p>
      </div>
      <div class="card">
        <img src="images/owl.jpg" alt="Card Image 3" />
        <h3>Wildlife Photos</h3>
        <p>
          Love taking wildlife photos.
        </p>
      </div>
    </section>
    <footer>
      <p>&copy; 2026 Halie Grace Creates. All rights reserved.</p>
    </footer>
    <script src="scripts/app.js"></script>
  </body>
</html>
